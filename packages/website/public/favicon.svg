<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Light tab bars need a deeper outline to read at 16px; dark ones keep the pastel ambient palette.
       Hex stop-color attributes are sRGB fallbacks for renderers without oklch(). -->
  <style>
    .peach { stop-color: oklch(66% 0.17 44); }
    .lilac { stop-color: oklch(58% 0.21 303); }
    .blue { stop-color: oklch(60% 0.15 254); }
    .mint { stop-color: oklch(64% 0.12 171); }
    .gold { stop-color: oklch(72% 0.14 80); }
    @media (prefers-color-scheme: dark) {
      .peach { stop-color: oklch(82.5% 0.132 44); }
      .lilac { stop-color: oklch(75.5% 0.167 303); }
      .blue { stop-color: oklch(80.1% 0.111 254); }
      .mint { stop-color: oklch(82.9% 0.145 171); }
      .gold { stop-color: oklch(89% 0.116 92); }
    }
  </style>
  <defs>
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="3" y1="6" x2="29" y2="26">
      <stop offset="0" class="peach" stop-color="#e4682a"/>
      <stop offset="0.25" class="lilac" stop-color="#954ede"/>
      <stop offset="0.5" class="blue" stop-color="#3681d7"/>
      <stop offset="0.75" class="mint" stop-color="#1aa382"/>
      <stop offset="1" class="gold" stop-color="#d29922"/>
    </linearGradient>
    <!-- Hide the back bulb behind the front one, leaving a small gap instead of a fill. -->
    <mask id="behind-front" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="white"/>
      <path d="M18 23C18 20.5 14.5 19 14.5 13.5A7 7 0 1 1 28.5 13.5C28.5 19 25 20.5 25 23Z" fill="black" stroke="black" stroke-width="5.5" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g fill="none" stroke="url(#rainbow)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <g mask="url(#behind-front)">
      <path d="M7 20C7 17.5 3.5 16 3.5 10.5A7 7 0 1 1 17.5 10.5C17.5 16 14 17.5 14 20Z"/>
      <path d="M8 24h5"/>
    </g>
    <path d="M18 23C18 20.5 14.5 19 14.5 13.5A7 7 0 1 1 28.5 13.5C28.5 19 25 20.5 25 23Z"/>
    <path d="M19 27h5"/>
  </g>
</svg>
